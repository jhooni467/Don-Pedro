<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#667e63" />
    <meta name="description" content="DON PEDRO: una tiendita mexicana, un gran negocio." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="landscape" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <title>DON PEDRO — Mi tiendita</title>
  </head>
  <body>
    <main id="game-root" aria-label="Mundo 3D explorable de Don Pedro"></main>

    <section id="hud" aria-label="Información del juego">
      <div class="brand-card">
        <span class="brand-name">DON PEDRO</span>
        <span class="brand-subtitle">MI TIENDITA · DÍA 1</span>
      </div>
      <div class="cash-card">
        <span class="cash-label">CAJA</span>
        <span class="cash-value">$250.00</span>
      </div>
    </section>

    <div id="hint" class="hint-card">Explora tu tiendita</div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <div id="interaction-prompt" class="interaction-prompt" aria-hidden="true">
      <div id="interaction-action" class="interaction-action" role="button" aria-label="Mantener pulsado para agarrar el asa o interactuar con el objeto" tabindex="0">
        <div id="interaction-progress" class="interaction-progress">
          <div class="interaction-progress-inner"><span id="interaction-symbol">✊</span></div>
        </div>
        <div class="interaction-copy">
          <strong id="interaction-title">ABRIR</strong>
          <small id="interaction-subtitle">MANTÉN PULSADO</small>
        </div>
      </div>
    </div>

    <div id="joystick" class="joystick" aria-label="Joystick fijo para caminar">
      <div class="joystick-ring"></div>
      <div id="joystick-knob" class="joystick-knob"></div>
    </div>

    <div id="orientation-overlay" aria-hidden="true">
      <div class="rotate-device"></div>
      <div class="orientation-title">GIRA TU DISPOSITIVO</div>
      <div class="orientation-copy">DON PEDRO se juega en horizontal para que puedas recorrer la tienda y el barrio.</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
